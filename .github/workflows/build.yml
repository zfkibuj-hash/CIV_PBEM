# Build Civ4PBEMManager.exe from public source (SignPath / release pipeline).
name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "main.py"
      - "build.spec"
      - "requirements.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate icon if missing
        run: |
          if (-not (Test-Path icon.ico)) {
            pip install Pillow
            python generate_icon.py
          }
        shell: pwsh

      - name: Embed Windows version resource
        run: python tools/gen_version_info.py

      - name: Read APP_VERSION
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/config.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: PyInstaller
        run: python -m PyInstaller build.spec --noconfirm

      - name: Upload unsigned EXE
        uses: actions/upload-artifact@v4
        with:
          name: Civ4PBEMManager-v${{ steps.ver.outputs.version }}-unsigned
          path: dist/Civ4PBEMManager.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (unsigned, tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Civ4PBEMManager.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
